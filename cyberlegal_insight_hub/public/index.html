<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CyberLegal Insight Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Ensure PUBLIC_URL is defined for CRA and all template expansions -->
    <script>
      if (typeof window.PUBLIC_URL === "undefined") {
        window.PUBLIC_URL = ".";
      }
      if (typeof window.process === "undefined") {
        window.process = { env: {} };
      }
      if (typeof window.process.env === "undefined") {
        window.process.env = {};
      }
      if (typeof window.process.env.PUBLIC_URL === "undefined") {
        window.process.env.PUBLIC_URL = ".";
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
